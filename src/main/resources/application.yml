# 로컬 관리자 화면은 사용자 로컬 서버와 같은 1건 임계치를 표시한다.
complaint:
  auto-action:
    book-report-threshold: 1
    reply-threshold: 1
    profile-image-threshold: 1
    background-image-threshold: 1
    introduction-threshold: 1

---
spring:
  config:
    activate:
      on-profile: prod

# 운영 관리자 화면은 사용자 운영 서버와 같은 5건 임계치를 표시한다.
complaint:
  auto-action:
    book-report-threshold: 5
    reply-threshold: 5
    profile-image-threshold: 5
    background-image-threshold: 5
    introduction-threshold: 5
